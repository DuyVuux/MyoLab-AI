[project]
name = "myolab-ai"
version = "0.1.0"
description = "sEMG/MFCV Fatigue Clinical Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "filelock>=3.13.0",
    "requests>=2.31.0",
    "fsspec>=2024.2.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
