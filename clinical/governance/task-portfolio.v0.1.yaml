        site_data_required_for:
          - LOWER_LIMB_FATIGUE_PROTOCOL
          - FORCE_OR_TORQUE_CONTEXT
          - SITE_QC_THRESHOLDS
        prohibited_claims:
          - HARD_FATIGUE_DIAGNOSIS
          - ELAPSED_TIME_AS_FATIGUE_GROUND_TRUTH
          - INCREASE_TASK_A_CONFIDENCE
          - TREATMENT_PRESCRIPTION
