        display_name: Lower-limb functional-state recognition
        status: ACTIVE_PARALLEL
        clinical_priority: VINMEC_PRIORITY_ACTIVE_PROGRAM
        body_region: LOWER_LIMB_KNEE
        target_users:
          - SPORTS_MEDICINE_CLINICIAN
          - REHABILITATION_CLINICIAN
          - PHYSIOTHERAPIST
          - MOTION_LAB_OPERATOR
          - RESEARCHER
        target_populations:
          - RESEARCH_PUBLIC_HEALTHY
          - RESEARCH_PUBLIC_PATIENT
          - SITE_HEALTHY_VOLUNTEER
          - SITE_PATIENT_CONTROLLED_PILOT
