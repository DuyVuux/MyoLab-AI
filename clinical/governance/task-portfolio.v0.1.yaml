tasks:
  A:
    name: Functional intention and state recognition
    problem_type: MULTICLASS_OR_STATE_RECOGNITION
    branches:
      - branch_id: A1
        display_name: Upper-limb hand-gesture recognition
        status: ACTIVE_PARALLEL
        clinical_priority: ACTIVE_PROGRAM
        body_region: UPPER_LIMB_HAND_WRIST_FOREARM
        target_users:
          - REHABILITATION_CLINICIAN
          - PHYSIOTHERAPIST
          - MOTION_LAB_OPERATOR
          - RESEARCHER
        target_populations:
          - RESEARCH_PUBLIC_HEALTHY
          - SITE_HEALTHY_VOLUNTEER
          - SITE_PATIENT_CONTROLLED_PILOT
        supported_protocol_families:
          - ISOLATED_HAND_GESTURE
          - WRIST_GESTURE
          - TRANSITION_SEQUENCE
          - CALIBRATED_REPETITION
        output_families:
          - GESTURE_LABEL
          - CONFIDENCE_OR_SCORE
          - ABSTENTION_REASON
          - REPETITION_LEVEL_RESULT
        dataset_roles:
          - dataset_id: MENDELEY_4CH_HAND_GESTURE_V2
            role: PRIMARY_SPARSE_GESTURE_ENGINEERING
          - dataset_id: GRABMYO_V1_1_0
            role: PRIMARY_CROSS_DAY_GESTURE
          - dataset_id: GRABMYOFLOW_V1_0_0
            role: TRANSITION_AND_ABSTENTION
        site_data_required_for:
          - NORAXON_CHANNEL_MAPPING
          - LOCAL_CALIBRATION
          - CLINICAL_TRANSFER
        prohibited_claims:
          - DIAGNOSE_NEUROLOGICAL_DISEASE
          - REPLACE_CLINICIAN
          - GUARANTEE_GESTURE_FUNCTION_RECOVERY
