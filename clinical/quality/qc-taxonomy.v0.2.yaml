authoritative_requirements:
- FR-030
- FR-037
- FR-038
- FR-039
- FR-040
- FR-041
- NFR-009
- NFR-011
principles:
- quality evidence != diagnosis
- physiological variation != acquisition artifact
- pathology != noise
- measurement fact != clinical interpretation
- ambiguous evidence => review/abstain, not forced cleanup
- reason code must reference evidence and versioned policy
- weak label candidate != expert ground truth
- PASS/WARNING/FAIL describes QC supportability, not disease severity
- raw signal remains immutable
- no numeric clinical/QC threshold is frozen in DAY21
scope_enum:
- SESSION
- CHANNEL
- WINDOW
signal_quality_enum:
- PASS
- WARNING
- FAIL
evaluation_status_enum:
