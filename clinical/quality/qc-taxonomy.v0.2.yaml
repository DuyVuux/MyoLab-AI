reason_code_policy:
  registry_path: services/quality-gate-service/configs/reason-codes.v0.1.yaml
  unknown_code_behavior: FAIL_CLOSED_CONFIGURATION_ERROR
  diagnosis_fields_allowed: false
  threshold_freeze_allowed_day21: false
  reason_without_evidence_allowed: false
aggregation_boundary:
  implemented_today: false
  target_day: DAY30
  principle: DAY21 defines semantics only; it does not implement window/channel/session aggregation.
  non_negotiable_rules:
  - PHYSIOLOGICAL_VARIATION_POSSIBLE cannot downgrade QC by itself.
  - POLICY_DEPENDENT evidence cannot become WARNING/FAIL without an approved versioned policy.
  - Disposition reasons cannot erase underlying detector/evidence reasons.
threshold_policy:
  numeric_thresholds_frozen: false
  status: TBD_SITE_VALIDATION_REQUIRED
  reason: SRS defines capability requirements; thresholds require later evidence/site validation and clinician approval.
weak_supervision_boundary:
