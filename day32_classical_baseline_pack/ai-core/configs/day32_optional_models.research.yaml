schema_version: day32-optional-models.v1
requires_core_gate: true
models:
  knn:
    family: distance_based
    scaling: standard
    grid:
      model__n_neighbors: [3, 5, 7, 11]
      model__weights: [uniform, distance]
      model__metric: [euclidean]
  qda_regularized:
    family: quadratic_generative
    scaling: standard
    numerical_gate_required: true
    grid:
      model__reg_param: [0.01, 0.1, 0.3]
  rbf_svm:
    family: nonlinear_kernel
    scaling: standard
    compute_gate_required: true
    grid:
      model__C: [1.0, 10.0]
      model__gamma: [scale, 0.01]
  gradient_boosting:
    family: boosted_tree
    scaling: none
    grid:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1]
      max_depth: [2]
