schema_version: day32-metrics-contract.v1
primary_metric: subject_macro_repetition_macro_f1
secondary_metrics:
  - repetition_macro_f1
  - balanced_accuracy
  - per_class_precision
  - per_class_recall
  - per_class_f1
  - confusion_matrix
  - worst_subject_macro_f1
  - worst_class_recall
  - fit_time_seconds
  - prediction_latency_ms
aggregation_priority:
  - mean_predict_proba
  - mean_decision_function
  - deterministic_majority_vote
uncertainty:
  method: participant_cluster_bootstrap
  confidence_level: 0.95
  smoke_iterations: 500
  full_iterations: 2000
