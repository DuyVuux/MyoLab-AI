schema_version: spectral-estimation-config.v0.1
config_id: spectral_estimation_v0.1
status: provisional_engineering_defaults
scope: offline_mvp0_spectral_foundation
clinical_validation_status: not_validated

input_contract:
  require_windowing_downstream_allowed: true
  required_windowing_config_id: windowing_v0.1
  required_preprocess_config_id: preprocess_v0.1
  required_profile_id: frequency_domain
  required_profile_purpose: psd_mdf_mnf
  canonical_amplitude_unit: uV
  require_window_status_valid: true
  require_finite_samples: true
  require_untapered_outer_window: true
  invalid_window_policy: emit_not_computed_row

estimator:
  method: welch
  return_onesided: true
  taper: hann
  detrend: constant
  scaling: density
  average: mean
  nperseg_policy: full_outer_window
  noverlap_samples: 0
  nfft_policy: equal_outer_window_length
  zero_padding_enabled: false

analysis_band:
  low_hz: 20.0
  high_hz: 400.0
  include_endpoints: true
  minimum_frequency_bin_count: 100

power_guard:
  minimum_band_power_uV2: 1.0e-12
  low_power_policy: emit_not_computed_row
  parseval_ratio_warning_lower: 0.90
  parseval_ratio_warning_upper: 1.10
  parseval_warning_blocks_downstream: false

output_contract:
  include_all_window_rows: true
  include_not_computed_rows: true
  include_raw_samples: false
  include_full_psd_axis: false
  include_analysis_band_frequency_axis_once: true
  include_analysis_band_psd_per_row: true
  include_window_geometry: true
  include_channel_context: true
  include_provenance: true
  row_schema_version: spectral-window-row.v0.1
  result_schema_version: spectral-estimation-result.v0.1
  result_hash_algorithm: sha256_canonical_json

future_features:
  mdf: {enabled: false, planned_day: 10}
  mnf: {enabled: false, planned_day: 10}
  spectral_slope: {enabled: false, planned_stage: trend_feature_extraction}
  spectral_entropy: {enabled: false, planned_stage: feature_extension}
  mfcv: {enabled: false, planned_stage: optional_eligibility_gated_extension}

safety:
  block_if_no_computed_rows: true
  do_not_impute_invalid_windows: true
  do_not_compute_mdf_mnf: true
  do_not_interpret_fatigue: true
  do_not_generate_frs: true
  do_not_train_ml: true
  synthetic_data_is_not_clinical_evidence: true

limitations:
  - Welch v0.1 dùng toàn bộ outer frequency window 1000 ms làm một segment, vì vậy chưa có giảm phương sai nhờ averaging nhiều segment.
  - Hann taper được áp dụng trong tầng spectral, không áp dụng ở windowing hoặc RMS/MAV.
  - Khoảng cách bin 1 Hz ở fixture Fs=1000 Hz và N=1000 không đồng nghĩa mọi dữ liệu thật có cùng độ phân giải.
  - Dải 20-400 Hz là mặc định kỹ thuật MVP-0; cần audit thiết bị và validation local trước khi dùng cho pilot.
  - Peak frequency và Parseval ratio là chỉ số QA, không phải fatigue biomarkers cuối cùng.
  - Day 9 chưa tính MDF, MNF, slope, fatigue status hoặc khuyến nghị lâm sàng.
  - Evidence hiện tại là synthetic/software verification, không phải clinical validation.
