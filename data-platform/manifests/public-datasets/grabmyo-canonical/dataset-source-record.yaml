known_errata:
  - claim: "Paper in sai thứ tự Wrist Flexion/Wrist Extension so với dữ liệu thật"
    detail: "Paper trình bày 'Wrist Flexion' trước 'Wrist Extension'; MotionSequence.txt thật (nguồn đúng) có thứ tự ngược lại: Wrist Extension (11) trước Wrist Flexion (12)."
    source: "PhysioNet dataset page, mục release notes v1.1.0"
    impact: "Mapping gesture_id -> tên cử chỉ PHẢI dựa vào MotionSequence.txt, không dùng bảng trong paper."

scope_guardrails:
  valid_for:
    - "Task A gesture-recognition dataset (multi-day, subject-independent + cross-day validation)"
    - "So sánh domain-gap và khả năng gộp với mendeley-4channel-hand-gesture-v2"
    - "Nguồn bổ sung lớp 'hand_open' — lớp mà Mendeley KHÔNG có (xem label-dictionary.yaml)"
  not_valid_for:
    - "Biometric/identification claims (dataset gốc còn dùng cho biometrics, ngoài phạm vi Task A ở đây)"
    - "Clinical performance claims trên bệnh nhân (chỉ có 43 người khỏe mạnh)"

open_items_for_later_steps:
