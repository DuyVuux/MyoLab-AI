# canonical-mapping-draft.yaml — Mendeley 4-Channel Hand Gesture v2
# Chuyển đổi từ ai-core/configs/mendeley_4ch_mapping_profile.template.json

schema_version: dataset-adapter-profile.v1
profile_id: MENDELEY_4CH_GESTURE.profile.v0.1
verification_status: NOT_VERIFIED
dataset_id: MENDELEY_4CH_GESTURE

source_format: "<REQUIRED_AFTER_INVENTORY>"
file_glob: "<REQUIRED_AFTER_INVENTORY>"

text:
  encoding: utf-8
  delimiter: ","
  header_rows: 1

signal:
  raw_or_processed: "<REQUIRED>"
  sampling_rate_hz: null    # xác minh từ paper/dữ liệu thật
  source_unit: "<REQUIRED>"
  canonical_unit: uV
  time:
    mode: sample_index_or_column
    source_column: null
    unit: null
  channels:
    - source_column: "<REQUIRED>"
      canonical_id: CH01
    - source_column: "<REQUIRED>"
      canonical_id: CH02
    - source_column: "<REQUIRED>"
      canonical_id: CH03
    - source_column: "<REQUIRED>"
      canonical_id: CH04

path_metadata:
  regex: "<REQUIRED_NAMED_GROUPS_SUBJECT_REPETITION_LABEL>"
  required_groups:
    - subject_id
    - repetition_id
    - source_label
  optional_groups:
    - day_id
    - session_id
    - trial_id

scope_flags:
  clinical_use_allowed: false
  motion_lab_transfer_verified: false
  mfcv_eligible: false

notes:
  - "Tất cả trường <REQUIRED> phải được điền sau khi inventory hoàn tất."
  - "sampling_rate_hz: xác minh từ paper và dữ liệu thật, không suy luận."
