schema_version: pre-day30-remote-eda.v1
execution_mode: BOUNDED_SAMPLE

network:
  connect_timeout_seconds: 15
  read_timeout_seconds: 120
  user_agent: MyoLab-AI-Research-EDA/0.1
  retries: 2
  require_official_source: true
  allow_http_range: true

budgets:
  max_sample_records: 300
  max_sample_total_bytes: 2147483648
  max_cache_bytes: 10737418240
  max_single_object_bytes_without_confirmation: 1073741824
  chunk_rows: 50000
  max_channels_to_plot: 8
  max_plots_total: 100

partition_policy:
  allowed_signal_partitions:
    - train
    - validation
  forbidden_signal_partitions:
    - test
    - sealed_test
  unknown_partition_action: BLOCK

sampling_policy:
  seed: 302026
  stratify_fields:
    - subject_id
    - day_id
    - source_label
  require_all_labels_when_budget_allows: true
  require_all_days_for_grabmyo: true

statistics:
  compute:
    - count
    - mean
    - std
    - min
    - max
    - rms
    - mav
    - nonfinite_ratio
    - zero_ratio
    - exact_flatline_ratio
    - potential_clipping_ratio
  frequency_features_enabled: false
  reason: sampling_rate_and_raw_signal_must_be_verified_first

outputs:
  format: jsonl
  compact_summary: json
  plot_policy: STRATIFIED_ONLY

safety:
  training_allowed: false
  test_signal_access_allowed: false
  infer_unit_from_magnitude: false
  infer_sampling_rate_from_rows: false
  fatigue_inference_from_cross_day_shift: false
