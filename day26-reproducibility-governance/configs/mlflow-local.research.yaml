schema_version: '1.0'
status: PROVISIONAL_LOCKED_FOR_DAY26_BLUEPRINT
rationale: Local MLflow is a convenience layer; content-addressed manifests remain
  governance SSOT.
evidence_ids:
- EXT-MLFLOW-TRACKING
- EXT-MLFLOW-REGISTRY
- D26-INT-PROTOCOL
open_questions:
- Confirm site-approved storage and backup paths
- Define authentication/RBAC before network exposure
training_allowed: false
tracking_decision: hybrid
governance_ssot: content-addressed-file-manifests
mlflow:
  version: 3.14.0
  host: 127.0.0.1
  port: 5000
  backend_store_uri: sqlite:////data/experiments/mlflow/mlflow.db
  default_artifact_root: file:///data/experiments/mlflow/artifacts
  network_exposure: loopback-only
  raw_clinical_data_logging_allowed: false
  phi_in_tags_allowed: false
paths:
  run_root: /data/experiments/runs
  experiment_registry_root: /data/experiments/registry/experiments
  model_registry_root: /data/experiments/registry/models
  exported_model_root: /data/models/exported
  backup_root: /data/backups/mlflow
future_multi_user:
  trigger:
  - concurrent writers
  - pilot access
  - RBAC required
  - network access required
  - SQLite contention
  target_backend: PostgreSQL
  target_artifact_store: approved on-prem S3-compatible object storage
  required_controls:
  - TLS
  - authentication
  - RBAC
  - coordinated backup
  - restore drill
  - migration rollback
