  topic: canonical_serialization
  decision: json_yaml_plus_typed_arrays_allow_pickle_false
  status: PREFERRED
  rationale: Strict, inspectable, hashable format with smaller arbitrary-deserialization
    surface for simple classical models.
  evidence_ids:
