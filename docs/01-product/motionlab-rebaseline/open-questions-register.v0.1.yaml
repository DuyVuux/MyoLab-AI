version: '0.1'
day: DAY01
questions:
- question_id: OQ-001
  question: Số ca sEMG/tháng và phân bố theo bệnh lý/protocol là bao nhiêu?
  source:
  - PRD §14
  - SRS TBD-01
  why_it_matters: Cần sizing workload, baseline và sampling plan.
  evidence_needed: Case-volume log/de-identified operational count from MotionLab
  owner: Clinical Product / MotionLab
  target_day: DAY_03
  blocking_scope: Time-motion baseline and pilot cohort sizing
  fallback: Use qualitative workflow mapping; do not invent volume.
  status: OPEN
  evidence_status: UNKNOWN
- question_id: OQ-002
  question: Manual processing time theo từng công đoạn và toàn ca là bao nhiêu?
  source:
  - PRD §10, §14
  why_it_matters: North Star và KPI giảm toil cần baseline thực đo.
  evidence_needed: Time-motion observation with task-level timestamps
  owner: Clinical Product Analytics
  target_day: DAY_03
  blocking_scope: KPI baseline and pilot success definition
  fallback: Keep ≥60 min/case and ≥50% only as documented estimate/research target,
    not baseline.
  status: OPEN
  evidence_status: UNKNOWN
- question_id: OQ-003
  question: Tỷ lệ đo lại là bao nhiêu và nguyên nhân đo lại được phân loại thế nào?
  source:
  - PRD §14
  - SRS TBD-02
  why_it_matters: QC benefit cannot be measured without remeasurement baseline/reasons.
  evidence_needed: Historical/observed remeasurement log with reason taxonomy
  owner: Clinical Product / MotionLab
  target_day: DAY_03
  blocking_scope: QC impact measurement
  fallback: Record occurrence qualitatively; do not invent rate.
  status: OPEN
  evidence_status: UNKNOWN
- question_id: OQ-004
  question: Filter/normalization/window/protocol hiện bác sĩ dùng là gì và nguồn tham
    chiếu nào?
  source:
  - PRD §14
  - SRS TBD-03
  why_it_matters: Preprocessing profile must preserve physiology and match workflow.
  evidence_needed: Current MR4/myoRESEARCH settings, SOP/protocol and clinician confirmation
  owner: Clinical + DSP
  target_day: DAY_04
  blocking_scope: Preprocessing design and QC taxonomy
  fallback: No universal pipeline/threshold; configuration remains TBD.
  status: OPEN
  evidence_status: UNKNOWN
- question_id: OQ-005
  question: Output sEMG cuối hiện hỗ trợ quyết định lâm sàng cụ thể nào?
  source:
  - PRD §14
  - SRS TBD-04
  why_it_matters: Metric selection and interpretation boundary depend on actual decision
    context.
  evidence_needed: Clinician interview + current report/examples with de-identification
  owner: Clinical Product
  target_day: DAY_03
  blocking_scope: Metric/evidence/report design
  fallback: Limit Day01 to technical evidence support; no new clinical claim.
  status: OPEN
  evidence_status: UNKNOWN
- question_id: OQ-006
  question: Clinical/operator metadata được lưu ở đâu và mức đầy đủ ra sao?
  source:
  - PRD §14
  - SRS FR-022/023
  why_it_matters: Valid comparison and eligibility need protocol/context metadata.
  evidence_needed: Actual metadata sources/data dictionary and sample de-identified
    fields
  owner: Data + Clinical
  target_day: DAY_12
  blocking_scope: Canonical Session/ProtocolContext contract
  fallback: Missing metadata must warn/fail; never infer patient/protocol facts.
  status: OPEN
  evidence_status: DISCOVERY_REQUIRED
- question_id: OQ-007
  question: PHI/identifier, consent và de-identification workflow site là gì?
  source:
  - PRD §14
  - SRS TBD-05/NFR-004
  why_it_matters: Real patient data governance is a prerequisite.
  evidence_needed: Approved Vinmec governance path, de-identification SOP, access/retention
    decision
  owner: Privacy / Vinmec IT
  target_day: DAY_05
  blocking_scope: Real-data access and repository boundary
  fallback: Do not ingest/commit raw patient data into the repo/Day01 pack.
  status: OPEN
  evidence_status: DISCOVERY_REQUIRED
- question_id: OQ-008
  question: Ý nghĩa chính xác của LT/RT Force, pressure/contact/COP fields trong Noraxon
