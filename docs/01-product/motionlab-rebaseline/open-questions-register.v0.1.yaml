  why_it_matters: P1 left/right logic requires field semantics before algorithm design.
  evidence_needed: Vendor/site confirmation + matched trial/reference
  owner: Pressure P1 Lead
  target_day: DAY_64
  blocking_scope: Pressure P1 design
  fallback: Keep semantics NOT_VERIFIED; no GRF/clinical interpretation overclaim.
  status: OPEN
  evidence_status: DISCOVERY_REQUIRED
- question_id: OQ-009
  question: Tên chính xác knee angle/DOF/biomechanical variable gặp lỗi là gì?
  source:
  - SRS DR-K02
  - PRD §14
  why_it_matters: Cannot design correction without identifying the variable.
  evidence_needed: Real failure case + software output naming
  owner: Knee Discovery Lead / MotionLab
  target_day: DAY_74
