version: '0.1'
day: DAY01
decisions:
- decision_id: D01
  title: 90-day roadmap supersedes the old post-PRE-DAY41_01 schedule
  date: '2026-08-07'
  status: ACCEPTED
  context: Legacy work had strong gesture/fatigue/MFCV/lower-limb momentum; the Vinmec
    problem framing changed.
  decision: Use the 90-day re-baselined roadmap for work after PRE-DAY41_01; reuse
    old assets only by explicit disposition.
  rationale: Roadmap §2 and §5 state that continuation of the old schedule would violate
    Automation of toil first.
  source:
  - SRC-ROADMAP-001
  - SRC-PRD-001
  alternatives:
  - Continue PRE-DAY41_02 sequence
  consequences:
  - Legacy assets remain available for reuse/regression; schedule is superseded.
  affected_requirements:
  - PRD-NS-01
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
  review_required: false
- decision_id: D02
  title: P0 is sEMG Data Processing & Quality Intelligence
  date: '2026-08-07'
  status: ACCEPTED
  context: The highest-priority observed need is time-consuming data/noise processing,
    not a missing classifier.
  decision: P0 is ingestion, immutable raw/provenance, validation, QC, versioned processing,
    metric eligibility, evidence and clinician review.
  rationale: PRD §7.1 and SRS §1–2 explicitly set this MVP priority.
  source:
  - SRC-PRD-001
  - SRC-SRS-001
  alternatives: []
  consequences: []
  affected_requirements:
  - PRD-NEED-01
  - FR-001
  - FR-030
  - FR-050
  - FR-060
  - FR-070
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
  review_required: false
- decision_id: D03
  title: Plantar Pressure is P1
  date: '2026-08-07'
  status: ACCEPTED
  context: Left/right assignment is a repeated workflow pain but secondary to the
    sEMG P0.
  decision: Keep plantar-pressure left/right correction as P1 with confidence, abstention,
    clinician override and abnormal-gait evaluation.
  rationale: PRD §7.2 and SRS §11 define this scope and its non-diagnostic boundary.
  source:
  - SRC-PRD-001
  - SRC-SRS-001
  alternatives: []
  consequences: []
  affected_requirements:
