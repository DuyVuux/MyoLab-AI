- decision_id: D11
  title: CSV availability does not authorize model training
  date: '2026-08-07'
  status: ACCEPTED
  context: Having exportable data does not establish workflow, labels, quality taxonomy,
    privacy or intended-use readiness.
  decision: Do not start model training merely because CSV exists; training is not
    part of DAY01.
  rationale: PRD §15 acceptance gate and roadmap critical path put workflow/data/QC
    evidence before modeling.
  source:
  - SRC-PRD-001
  - SRC-ROADMAP-001
  alternatives: []
  consequences: []
