  - FR-038
  - FR-060
  - NFR-012
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
  review_required: false
- decision_id: D08
  title: Preserve physiology
  date: '2026-08-07'
  status: ACCEPTED
  context: Pathology/physiological variation can look different from healthy signals
    and must not be erased as noise.
  decision: Preserve raw and separate measurement artifact evidence from physiological
    variation; do not normalize a patient toward healthy by assumption.
  rationale: PRD Product Principles/risks and SRS definitions/FR-036/FR-053.
  source:
  - SRC-PRD-001
  - SRC-SRS-001
  alternatives: []
  consequences: []
