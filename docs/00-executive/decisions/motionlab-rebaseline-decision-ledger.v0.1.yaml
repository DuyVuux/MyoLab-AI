- decision_id: D10
  title: Raw data is immutable
  date: '2026-08-07'
  status: ACCEPTED
  context: Traceability and safe reprocessing require preservation of the source signal.
  decision: Never overwrite/interpolate raw; store source hash and keep masks/rejections
    in derived layers.
  rationale: SRS Raw definition, FR-007/008/053/054, NFR-003, AC-09.
  source:
  - SRC-SRS-001
  - SRC-CSV-001
  alternatives: []
  consequences: []
