  review_required: false
- decision_id: D05
  title: MFCV is optional and requires site eligibility
  date: '2026-08-07'
  status: ACCEPTED
  context: Vendor/legacy capability does not prove site electrode geometry/IED/alignment.
  decision: Keep MFCV disabled/not eligible unless site evidence satisfies FR-064;
    MFCV unavailable is not a system failure.
  rationale: SRS FR-064/TBD-08 and roadmap DAY49 explicitly make MFCV optional and
    site-gated.
  source:
  - SRC-SRS-001
  - SRC-ROADMAP-001
  alternatives: []
  consequences: []
  affected_requirements:
  - FR-064
  - TBD-08
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
  review_required: true
- decision_id: D06
  title: No autonomous diagnosis, treatment or finalization
  date: '2026-08-07'
  status: ACCEPTED
  context: The system is clinical decision-support/data automation.
  decision: Never auto-diagnose, recommend treatment autonomously, or finalize a clinical
    result without clinician approval.
  rationale: SRS safety boundary/out-of-scope and PRD positioning/out-of-scope are
    explicit.
  source:
  - SRC-SRS-001
  - SRC-PRD-001
  alternatives: []
  consequences:
  - Draft technical analysis remains non-final until clinician approval.
  affected_requirements:
  - FR-076
  - FR-077
  - NFR-012
  - AC-08
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
  review_required: false
- decision_id: D07
  title: Quality before intelligence
  date: '2026-08-07'
  status: ACCEPTED
  context: Higher-level metrics are unsafe when input quality/supportability is inadequate.
  decision: Gate downstream analysis on data/QC eligibility; fail or abstain when
    unsupported.
  rationale: PRD Product Principles and SRS QC/eligibility requirements.
  source:
  - SRC-PRD-001
  - SRC-SRS-001
  alternatives: []
  consequences: []
  affected_requirements:
