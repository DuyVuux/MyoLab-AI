- decision_id: D12
  title: Public healthy datasets cannot establish Vinmec clinical effectiveness
  date: '2026-08-07'
  status: ACCEPTED
  context: Legacy public datasets are engineering/research assets and differ from
    the MotionLab patient population/site workflow.
  decision: Keep public healthy datasets for regression/debugging/research; do not
    use them as evidence of Vinmec clinical effectiveness.
  rationale: Roadmap Legacy Asset Disposition explicitly states this limitation.
  source:
  - SRC-ROADMAP-001
  - SRC-LEGACY-001
  alternatives: []
  consequences:
  - Clinical effectiveness requires site-appropriate evidence/validation.
  affected_requirements:
  - PRD-NEED-03
  supersedes: []
  superseded_by: []
  owner: VSF Product/Clinical AI/Architecture
