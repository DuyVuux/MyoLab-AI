  review_required: false
- decision_id: D09
  title: Human final authority
  date: '2026-08-07'
  status: ACCEPTED
  context: Doctors/KTVs remain responsible for professional interpretation.
  decision: The machine surfaces evidence/exceptions; clinicians accept/override/reprocess/remeasure/inconclusive
    and approve finalization.
  rationale: PRD Product Principles/workflow and SRS FR-070..077.
