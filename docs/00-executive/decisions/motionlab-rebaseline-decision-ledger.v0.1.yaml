- decision_id: D04
  title: Knee/ACL remains discovery-gated
  date: '2026-08-07'
  status: ACCEPTED
  context: The exact angle/DOF, failure mode and root cause are under-specified.
  decision: Do not design or implement a Knee/ACL correction algorithm until DR-K01..DR-K08
    are complete enough for design.
  rationale: SRS §12 has an explicit gate; PRD §7.3 says not to call it AI correction
    before root-cause clarification.
  source:
  - SRC-SRS-001
  - SRC-PRD-001
  alternatives: []
  consequences:
  - DAY73–80 are discovery/root-cause work, not algorithm development.
  affected_requirements:
  - DR-K01
  - DR-K02
  - DR-K03
  - DR-K04
  - DR-K05
  - DR-K06
  - DR-K07
  - DR-K08
  supersedes: []
