schema_version: day37-eligibility-policy.v1
sealed_test_access_allowed: false
pooled_dataset_allowed: false
random_window_statistics_allowed: false
hard_fatigue_diagnosis_allowed: false

repeatability_requires:
  - subject_id
  - repetition_id
  - protocol_id
  - task_label
  - feature_version

similarity_requires:
  - fixed_feature_columns
  - scaler_or_template_provenance
  - nonfinite_free_vector

cocontraction_requires:
  - verified_agonist_antagonist_mapping
  - same_side
  - synchronized_time_base
  - compatible_envelope_units
  - active_phase
  - declared_normalization_method

default_public_dataset_cocontraction_state:
  mendeley: NOT_ELIGIBLE_ANATOMICAL_MAPPING_UNVERIFIED
  grabmyo: NOT_ELIGIBLE_ANATOMICAL_MAPPING_UNVERIFIED
