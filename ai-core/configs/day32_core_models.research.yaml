schema_version: day32-core-models.v1
random_state: 3201
models:
  dummy_majority:
    family: dummy
    required: true
    scaling: none
    params: {strategy: most_frequent}
  dummy_stratified:
    family: dummy
    required: true
    scaling: none
    params: {strategy: stratified, random_state: 3201}
  lda_shrinkage:
    family: linear_generative
    required: true
    scaling: standard
    params: {solver: lsqr, shrinkage: auto}
  logistic_regression:
    family: linear_discriminative_probabilistic
    required: true
    scaling: standard
    params:
      solver: lbfgs
      class_weight: balanced
      max_iter: 2000
      C: 1.0
    tiny_grid:
      model__C: [0.1, 1.0, 10.0]
  linear_svm:
    family: linear_max_margin
    required: true
    scaling: standard
    params: {class_weight: balanced, C: 1.0, dual: auto}
    tiny_grid:
      model__C: [0.1, 1.0, 10.0]
  random_forest:
    family: nonlinear_tree_bagging
    required: true
    scaling: none
    params:
      n_estimators: 300
      class_weight: balanced_subsample
      max_features: sqrt
      random_state: 3201
      n_jobs: 1
    tiny_grid:
      max_depth: [null, 12]
      min_samples_leaf: [1, 5]
