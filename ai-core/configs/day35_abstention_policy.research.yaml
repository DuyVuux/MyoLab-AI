schema_version: day35-abstention-policy.v1
engineering_objectives:
  target_coverage: 0.80
  maximum_selective_risk: 0.10
  minimum_per_class_coverage: 0.60
quality_policy:
  fail: abstain_quality_fail
  warning_below_threshold: abstain_low_quality_confidence
