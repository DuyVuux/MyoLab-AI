schema_version: "1.0"
status: "PROVISIONAL_LOCKED_FOR_DAY26_BLUEPRINT"
trainingAllowed: false
execution_state: "NOT_RUN"
scope: sparse_semg_4_to_16_channels
window_grid_ms: [150, 200, 250, 500, 1000]
optional_window_grid_ms: [100, 125, 300]
feature_groups:
  F0:
    role: amplitude_sanity
    features: [rms, mav]
  F1:
    role: sparse_classical_core
    features: [rms, mav, standard_deviation, waveform_length, zero_crossing, slope_sign_change, ar_order_4]
  F2:
    role: frequency_extension
    features: [rms, mav, standard_deviation, waveform_length, zero_crossing, slope_sign_change, ar_order_4, median_frequency, mean_frequency, spectral_entropy, relative_band_power]
  F3:
    role: fatigue_context_extension
    features: [rms_trend, mdf_trend, mnf_trend, elapsed_time_context, qc_context]
    default_use_in_gesture_predictor: false
  F4:
    role: conditional_inter_channel
    features: [activation_ratios, channel_correlations, antagonist_pair_metrics]
    requires_fixed_montage: true
excluded_from_sparse_baseline:
  - hd_semg_spatial_maps
  - motor_unit_decomposition
  - propagation_vectors
  - mfcv_dependent_features
normalization_candidates:
  mandatory_comparator: [none]
  optional_baselines: [training_fold_zscore, training_fold_robust_scaler]
  site_confirmed_only: [rest_baseline, mvc]
  later_research: [causal_session_normalization, domain_adaptive_normalization]
feature_selection:
  inner_fold_only: true
  candidates: [mrmr, mutual_information, l1_embedded, sequential_later, permutation_audit]
  stability_reporting_required: true
