# Day 37 Task C Metric Registry
# This file freezes the definitions for repeatability, similarity, and co-contraction metrics.

metrics:
  - metric_id: "within_subject_cv"
    metric_family: "repeatability"
    version: "1.0.0"
    unit: "percent"
    aggregation_unit: "subject_protocol_task_metric"
    ratio_scale_positive_required: true
    minimum_repetitions: 3
    epsilon: 1.0e-12
    nonfinite_policy: "block"
    zero_denominator_policy: "unsupported"
    clinical_interpretation_allowed: false

  - metric_id: "absolute_difference"
    metric_family: "repeatability"
    version: "1.0.0"
    unit: "absolute"
    aggregation_unit: "subject_protocol_task_metric"
