schema_version: day29-cross-day-drift.v1
status: DESCRIPTIVE_ONLY
fatigue_inference_allowed: false
causal_inference_allowed: false

comparison_keys:
  - subject_id
  - canonical_label
  - channel_id

feature_columns:
  - rms
  - mav
  - median
  - mad
  - std

minimum_records_per_day_group: 2
pairing_strategy: all_observed_day_pairs

metrics:
  - median_day_a
  - median_day_b
  - mad_day_a
  - mad_day_b
  - ratio_b_over_a
  - robust_shift_z

compatibility_requirements:
  same_signal_unit: true
  same_channel_semantics: true
  same_canonical_label: true
  same_preprocessing_profile: true

required_limitation_text: >
  Day-to-day distribution shift does not identify its cause. It may reflect electrode
  placement, contact, posture, force, protocol execution, acquisition settings or
  physiological change. It must not be reported as confirmed fatigue.
