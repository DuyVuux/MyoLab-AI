schema_version: mvp0-regression-profile.v0.1
profile_id: mvp0_regression_v0.1
pipeline_config: ai-core/configs/offline_analysis_mvp0.yaml
evidence_scope: software_analytical_regression_on_synthetic_fixtures_only
clinical_validation_status: not_validated

scenario_order:
  - golden
  - warning_clipping
  - warning_motion
  - warning_powerline
  - fail_flatline
  - fail_nonfinite
  - fail_short_duration

scenarios:
  golden:
    manifest: data-platform/synthetic-data/golden_signal_01.manifest.json
    expected:
      qc_status: pass
      qc_reason_codes: []
      analysis_status: completed
      technical_conclusion: supported_pattern
      confidence_category: engineering_high
      inference_status: completed
      final_downstream_allowed: true
  warning_clipping:
    manifest: qa-validation/test-data/synthetic/qc_warning_clipping.manifest.json
    expected:
      qc_status: warning
      qc_reason_codes: [CLIPPING_SUSPECTED]
      analysis_status: completed_with_warnings
      technical_conclusion: supported_pattern
      confidence_category: engineering_high
      inference_status: completed_with_warnings
      final_downstream_allowed: true
  warning_motion:
    manifest: qa-validation/test-data/synthetic/qc_warning_motion_artifact.manifest.json
    expected:
      qc_status: warning
      qc_reason_codes: [MOTION_ARTIFACT_HIGH]
      analysis_status: completed_with_warnings
      technical_conclusion: supported_pattern
      confidence_category: engineering_high
      inference_status: completed_with_warnings
      final_downstream_allowed: true
  warning_powerline:
    manifest: qa-validation/test-data/synthetic/qc_warning_powerline.manifest.json
    expected:
      qc_status: warning
      qc_reason_codes: [POWERLINE_NOISE_HIGH]
      analysis_status: completed_with_warnings
      technical_conclusion: supported_pattern
      confidence_category: engineering_high
      inference_status: completed_with_warnings
      final_downstream_allowed: true
  fail_flatline:
    manifest: qa-validation/test-data/synthetic/qc_fail_flatline.manifest.json
    expected:
      qc_status: fail
      qc_reason_codes: [FLATLINE_EXCESSIVE]
      analysis_status: abstained
      technical_conclusion: abstained
      confidence_category: not_available
      inference_status: abstained
      final_downstream_allowed: false
  fail_nonfinite:
    manifest: qa-validation/test-data/synthetic/qc_fail_nonfinite.manifest.json
    expected:
      qc_status: fail
      qc_reason_codes: [NONFINITE_RATIO_EXCESSIVE]
      analysis_status: abstained
      technical_conclusion: abstained
      confidence_category: not_available
      inference_status: abstained
      final_downstream_allowed: false
  fail_short_duration:
    manifest: qa-validation/test-data/synthetic/qc_fail_short_duration.manifest.json
    expected:
      qc_status: fail
      qc_reason_codes: [ACTIVE_DURATION_TOO_SHORT]
      analysis_status: abstained
      technical_conclusion: abstained
      confidence_category: not_available
      inference_status: abstained
      final_downstream_allowed: false

repeatability:
  scenario_id: golden
  reruns: 2
  require_same_analysis_fingerprint: true
  require_same_stage_payload_hashes: true

synthetic_golden_numeric_anchors:
  time_domain_row_count: 239
  frequency_domain_row_count: 119
  computed_trend_channel_count: 1
  engineering_confidence_range: [0.90, 1.00]
  percent_change_ranges:
    rms: [40.0, 60.0]
    mav: [40.0, 60.0]
    mdf: [-35.0, -15.0]
    mnf: [-40.0, -20.0]
  note: Các range này khóa hành vi fixture synthetic; không phải clinical threshold.

safety_checks:
  verify_stage_payload_hashes: true
  prohibit_raw_sample_keys: true
  prohibit_direct_identifier_keys: true
  clinical_use_allowed_must_be_false: true
  human_review_required_must_be_true: true
  fail_scenarios_must_abstain: true
  warnings_must_propagate: true

forbidden_keys:
  - samples
  - samples_uV
  - raw_samples
  - signal_values
  - patient_name
  - full_name
  - mrn
  - email
  - phone

limitations:
  - Profile chỉ dùng synthetic fixtures và generic CSV contract.
  - Exact fingerprint repeatability được yêu cầu trong cùng environment; cross-environment cần numerical tolerance review.
  - Không ước lượng accuracy, sensitivity, specificity, ROC-AUC hoặc F1.
  - Không xác nhận clinical cut-off hoặc clinical usefulness.
