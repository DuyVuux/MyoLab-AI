openapi: 3.1.0
info:
  title: sEMG/MFCV Fatigue Clinical Intelligence API
  version: 0.1.0
  description: >-
    Contract MVP-1 cho import session và kích hoạt offline analysis. Output là
    technical decision-support evidence, không phải chẩn đoán hoặc khuyến nghị điều trị.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Sessions
  - name: Analyses
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Dịch vụ hoạt động
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /v1/sessions/import:
    post:
      tags: [Sessions]
      operationId: importSignalSession
      summary: Import signal file và sidecar manifest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [signal_file, manifest]
              properties:
                signal_file:
                  type: string
                  format: binary
                manifest:
                  type: string
                  description: JSON sidecar manifest serialized as UTF-8 text
      responses:
        '201':
          description: Session import resource đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionImportResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /v1/sessions/{session_id}/analyses:
    post:
      tags: [Analyses]
      operationId: createOfflineAnalysis
      summary: Tạo offline analysis job
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysis_profile_id]
              properties:
                analysis_profile_id:
                  const: offline_analysis_mvp0
      responses:
        '202':
          description: Analysis job đã được chấp nhận
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /v1/analyses/{analysis_id}:
    get:
      tags: [Analyses]
      operationId: getAnalysisJob
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Trạng thái analysis job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisJob'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/analyses/{analysis_id}/summary:
    get:
      tags: [Analyses]
      operationId: getAnalysisSummary
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Canonical API-facing analysis summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAnalysisSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Analysis chưa ở terminal state
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
  /v1/analyses/{analysis_id}/manifest:
    get:
      tags: [Analyses]
      operationId: getAnalysisManifest
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Audit/provenance manifest của analysis package
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, analysis_id, analysis_fingerprint_sha256, status, final]
                properties:
                  schema_version: {const: offline-analysis-manifest.v0.1}
                  analysis_id: {type: string}
                  analysis_fingerprint_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  status: {type: string}
                  final: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string}
    AnalysisId:
      name: analysis_id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    SessionImportResponse:
      type: object
      required: [schema_version, session_id, status, source_file_sha256, reason_codes, links]
      properties:
        schema_version: {const: session-import-response.v0.1}
        session_id: {type: string}
        status: {enum: [imported, import_rejected]}
        source_file_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        reason_codes: {type: array, items: {type: string}}
        links: {type: object, additionalProperties: {type: string}}
      additionalProperties: false
    AnalysisJob:
      type: object
      required: [schema_version, analysis_id, session_id, status, submitted_at, completed_at, links]
      properties:
        schema_version: {const: analysis-job.v0.1}
        analysis_id: {type: string}
        session_id: {type: string}
        status: {enum: [queued, running, completed, completed_with_warnings, abstained, failed]}
        submitted_at: {type: [string, 'null']}
        completed_at: {type: [string, 'null']}
        links: {type: object, additionalProperties: {type: string}}
      additionalProperties: false
    SessionAnalysisSummary:
      type: object
      required: [schema_version, analysis_id, session_id, status, technical_conclusion, signal_quality, channels, confidence, explainability, provenance, safety, limitations, links, summary_hash_sha256]
      properties:
        schema_version: {const: session-analysis-summary.v0.1}
        analysis_id: {type: string}
        session_id: {type: string}
        status: {enum: [completed, completed_with_warnings, abstained, blocked_by_wording_guard]}
        technical_conclusion: {enum: [supported_pattern, no_supported_pattern, inconclusive, abstained]}
        signal_quality:
          type: object
          required: [status, analysis_allowed, reason_codes, mfcv_eligible, mfcv_reason_codes]
          properties:
            status: {enum: [pass, warning, fail, import_rejected]}
            analysis_allowed: {type: boolean}
            reason_codes: {type: array, items: {type: string}}
            mfcv_eligible: {type: boolean}
            mfcv_reason_codes: {type: array, items: {type: string}}
        channels: {type: array, items: {type: object}}
        confidence:
          type: object
          required: [final_score_0_to_1, category, score_is_probability, clinical_calibration_status]
          properties:
            final_score_0_to_1: {type: [number, 'null'], minimum: 0, maximum: 1}
            category: {enum: [engineering_high, engineering_moderate, engineering_low, engineering_very_low, not_available]}
            score_is_probability: {const: false}
            clinical_calibration_status: {const: not_calibrated}
        explainability: {type: object}
        provenance: {type: object}
        safety:
          type: object
          required: [clinical_use_allowed, human_review_required, is_diagnosis, is_treatment_recommendation, is_return_to_play_decision, synthetic_data_is_clinical_evidence]
          properties:
            clinical_use_allowed: {const: false}
            human_review_required: {const: true}
            is_diagnosis: {const: false}
            is_treatment_recommendation: {const: false}
            is_return_to_play_decision: {const: false}
            synthetic_data_is_clinical_evidence: {const: false}
        limitations: {type: array, items: {type: string}}
        links: {type: object, additionalProperties: {type: string}}
        summary_hash_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      additionalProperties: false
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, error_code, trace_id, invalid_params]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        error_code: {type: string}
        trace_id: {type: string}
        invalid_params: {type: array, items: {type: object}}
      additionalProperties: false
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    PayloadTooLarge:
      description: File vượt giới hạn cấu hình
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    UnprocessableEntity:
      description: Request đúng cú pháp nhưng semantic validation không đạt
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    NotFound:
      description: Không tìm thấy resource
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Conflict:
      description: Resource conflict hoặc duplicate idempotency key
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
