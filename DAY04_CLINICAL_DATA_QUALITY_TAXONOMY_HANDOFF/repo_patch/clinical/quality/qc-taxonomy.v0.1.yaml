version: '0.1'
day: DAY04
status: DESIGNED_NOT_SITE_VALIDATED
title: MotionLab sEMG QC Taxonomy — Artifact vs Physiological Variation
authoritative_requirements:
- FR-030
- FR-031
- FR-032
- FR-033
- FR-034
- FR-035
- FR-036
- FR-037
- FR-038
- FR-039
- FR-040
- NFR-009
- PRD-JTBD-03
principles:
- physiological variation != artifact
- pathology != noise
- body habitus != artifact by itself
- measurement fact != clinical interpretation
- ambiguous evidence => clinician review / abstention, not forced cleanup
- raw signal remains immutable
- no numerical QC threshold is frozen in DAY04
evidence_status_enum:
- VERIFIED_DOCUMENTED
- OBSERVED_SAMPLE_DATA
- SITE_VERIFIED
- INFERRED
- ASSUMPTION
- UNKNOWN
- TBD
- NOT_VERIFIED
- DISCOVERY_REQUIRED
- CONFLICTING
signal_quality_enum:
- PASS
- WARNING
- FAIL
scope_enum:
- SESSION
- CHANNEL
- WINDOW
semantic_class_enum:
- DATA_INTEGRITY
- ACQUISITION_ARTIFACT_SUSPECTED
- PHYSIOLOGICAL_VARIATION_POSSIBLE
- AMBIGUOUS_ARTIFACT_VS_PHYSIOLOGY
- REVIEW_OR_DISPOSITION
quality_effect_enum:
- NONE
- WARNING
- FAIL
- POLICY_DEPENDENT
context_tags_never_sufficient_for_qc_failure:
- tag: STROKE_CONTEXT
  evidence_status: VERIFIED_DOCUMENTED
- tag: PARALYSIS_OR_PARESIS_CONTEXT
  evidence_status: VERIFIED_DOCUMENTED
- tag: MUSCLE_ATROPHY_CONTEXT
  evidence_status: VERIFIED_DOCUMENTED
- tag: BODY_HABITUS_HIGH_ADIPOSITY_CONTEXT
  evidence_status: VERIFIED_DOCUMENTED
- tag: BODY_HABITUS_LOW_MASS_CONTEXT
  evidence_status: VERIFIED_DOCUMENTED
reason_codes:
- code: MISSING_DROPOUT
  semantic_class: DATA_INTEGRITY
  requirement: FR-031
  definition: Missing samples, dropout, or an interval with no data is observed/quantified.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - SESSION
  - CHANNEL
  - WINDOW
  evidence_required:
  - sample/time availability evidence
  forbidden_inference: Do not infer pathology from missing data.
  threshold_status: TBD
- code: CLIPPING_SATURATION_SUSPECTED
  semantic_class: ACQUISITION_ARTIFACT_SUSPECTED
  requirement: FR-032
  definition: Signal shows behavior consistent with clipping/saturation, conditional
    on known acquisition/ADC characteristics.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - signal evidence
  - device/ADC characteristic when available
  forbidden_inference: Do not call a flat/large waveform clipping without acquisition
    evidence.
  threshold_status: NOT_VERIFIED
- code: BASELINE_NOISE_ELEVATED
  semantic_class: ACQUISITION_ARTIFACT_SUSPECTED
  requirement: FR-033
  definition: Baseline/noise indicator is elevated relative to an approved protocol/reference
    when such reference exists.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - protocol/reference identity
  - baseline/noise measurement
  forbidden_inference: No universal noise threshold is defined in DAY04.
  threshold_status: TBD
- code: POWERLINE_INTERFERENCE_SUSPECTED
  semantic_class: ACQUISITION_ARTIFACT_SUSPECTED
  requirement: FR-034
  definition: An indicator suggests power-line interference when applicable to the
    acquisition context.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - spectral/indicator evidence
  - acquisition context
  forbidden_inference: Do not hard-code a site frequency or threshold before site/config
    confirmation.
  threshold_status: NOT_VERIFIED
- code: LOW_FREQUENCY_CONTAMINATION_SUSPECTED
  semantic_class: ACQUISITION_ARTIFACT_SUSPECTED
  requirement: FR-035
  definition: An indicator suggests motion artifact or low-frequency contamination.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - time/frequency-domain indicator evidence
  - task/protocol context when available
  forbidden_inference: Low-frequency content alone does not prove artifact or justify
    deleting the waveform.
  threshold_status: TBD
- code: POOR_CONTACT_SUSPECTED
  semantic_class: ACQUISITION_ARTIFACT_SUSPECTED
  requirement: FR-036
  definition: Evidence suggests electrode/contact or channel acquisition abnormality.
  quality_effect: POLICY_DEPENDENT
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - channel evidence
  - contact/device evidence if available
  forbidden_inference: Do not convert suspected poor contact into a diagnosis or pathology
    label.
  threshold_status: NOT_VERIFIED
- code: CHANNEL_ABNORMALITY_UNRESOLVED
  semantic_class: AMBIGUOUS_ARTIFACT_VS_PHYSIOLOGY
  requirement: FR-036
  definition: A channel is atypical, but current evidence cannot establish measurement
    artifact versus physiological variation.
  quality_effect: WARNING
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - observed atypical channel evidence
  - explicit unresolved status
  forbidden_inference: Do not automatically clean, reject, or relabel as pathology.
  threshold_status: NOT_APPLICABLE
- code: PHYSIOLOGICAL_VARIATION_POSSIBLE
  semantic_class: PHYSIOLOGICAL_VARIATION_POSSIBLE
  requirement: PRD-JTBD-03
  definition: Observed signal difference may reflect physiology/pathology/state rather
    than measurement artifact; evidence is insufficient to discard it.
  quality_effect: NONE
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - signal evidence
  - clinical/protocol context when approved and available
  forbidden_inference: This is not a diagnosis and is not a reason to mark the signal
    as noise.
  threshold_status: NOT_APPLICABLE
- code: ARTIFACT_VS_PHYSIOLOGY_UNRESOLVED
  semantic_class: AMBIGUOUS_ARTIFACT_VS_PHYSIOLOGY
  requirement: PRD-JTBD-03
  definition: Available evidence cannot safely distinguish acquisition artifact from
    physiological variation.
  quality_effect: WARNING
  allowed_scopes:
  - CHANNEL
  - WINDOW
  evidence_required:
  - conflicting/insufficient evidence
  - reason for ambiguity
  forbidden_inference: No forced cleanup or pathology conclusion.
  threshold_status: NOT_APPLICABLE
- code: CHANNEL_WARNING
  semantic_class: REVIEW_OR_DISPOSITION
  requirement: FR-037/FR-039
  definition: One or more channels/windows require review while the session may remain
    usable.
  quality_effect: WARNING
  allowed_scopes:
  - SESSION
  - CHANNEL
  - WINDOW
  evidence_required:
  - underlying reason code(s)
  forbidden_inference: Generic warning must not replace the underlying evidence reason.
  threshold_status: NOT_APPLICABLE
- code: QUALITY_BLOCKED
  semantic_class: REVIEW_OR_DISPOSITION
  requirement: FR-038
  definition: Quality evidence is sufficient to block downstream metrics that are
    not supportable.
  quality_effect: FAIL
  allowed_scopes:
  - SESSION
  - CHANNEL
  - WINDOW
  evidence_required:
  - blocking underlying reason(s)
  - affected downstream capability
  forbidden_inference: Blocking an unsupported metric is not a clinical diagnosis.
  threshold_status: POLICY_DEPENDENT
- code: CLINICIAN_REVIEW_REQUIRED
  semantic_class: REVIEW_OR_DISPOSITION
  requirement: FR-039/NFR-009
  definition: The system requires clinician/operator review of an exception or ambiguity.
  quality_effect: WARNING
  allowed_scopes:
  - SESSION
  - CHANNEL
  - WINDOW
  evidence_required:
  - reason(s) requiring review
  forbidden_inference: Review-required is not equivalent to abnormal clinical finding.
  threshold_status: NOT_APPLICABLE
aggregation_contract:
  principle: Aggregate only from typed reasons. Physiology-context reasons with quality_effect
    NONE do not downgrade signal quality by themselves.
  rules:
  - Any FAIL reason => FAIL at the evaluated scope.
  - Else any WARNING reason => WARNING at the evaluated scope.
  - Else => PASS.
  - POLICY_DEPENDENT reasons cannot be promoted to WARNING/FAIL without a versioned
    approved policy.
  policy_status: DESIGNED_NOT_SITE_VALIDATED
threshold_policy:
  numeric_thresholds_frozen: false
  status: TBD_SITE_VALIDATION_REQUIRED
  reason: SRS explicitly states QC capability requirements are not fixed medical thresholds;
    site validation and clinician approval are required.
